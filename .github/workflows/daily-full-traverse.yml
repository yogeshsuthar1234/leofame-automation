name: Daily full post boost (all posts x likes/views/saves/shares)

# Twice a day: sync a handful of recent Instagram posts into data/posts.json, then
# traverse EVERY known post through all 4 leofame free-trial pages, waiting 90s per
# submission. The full list is sharded across parallel matrix jobs so the whole run
# finishes within the traverse job's 300-minute timeout even as the post list keeps
# growing — bump NUM_SHARDS (and the matrix list below), or raise timeout-minutes,
# if a shard ever gets close to that ceiling.

on:
  schedule:
    - cron: '0 0,12 * * *' # 00:00 and 12:00 UTC daily
  workflow_dispatch: {}

env:
  NUM_SHARDS: 8

jobs:
  sync-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        # apt-get (pulled in by --with-deps) occasionally hangs on the runner's
        # package mirror instead of failing outright, which used to stall the whole
        # job until GitHub's 6h ceiling force-cancelled it. Cap each attempt and retry
        # a couple of times so a mirror hiccup costs minutes, not hours.
        run: |
          for attempt in 1 2 3; do
            if timeout 480 npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Playwright install attempt $attempt failed or timed out, retrying..."
            sleep 10
          done
          echo "Playwright install failed after 3 attempts" >&2
          exit 1

      - name: Sync recent Instagram posts (anonymous, top few only)
        continue-on-error: true
        env:
          TARGET_IG_ACCOUNT: ${{ vars.TARGET_IG_ACCOUNT }}
          HEADLESS: 'true'
        run: node scripts/sync-recent-posts.js

      - name: Commit updated post list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posts.json
          git diff --cached --quiet || git commit -m "chore: sync instagram posts list [skip ci]"
          git push

  traverse:
    needs: sync-posts
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        # apt-get (pulled in by --with-deps) occasionally hangs on the runner's
        # package mirror instead of failing outright, which used to stall the whole
        # job until GitHub's 6h ceiling force-cancelled it. Cap each attempt and retry
        # a couple of times so a mirror hiccup costs minutes, not hours.
        run: |
          for attempt in 1 2 3; do
            if timeout 480 npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Playwright install attempt $attempt failed or timed out, retrying..."
            sleep 10
          done
          echo "Playwright install failed after 3 attempts" >&2
          exit 1

      - name: Traverse shard through all 4 leofame pages
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          TOTAL_SHARDS: ${{ env.NUM_SHARDS }}
          CLAIM_WAIT_MS: '90000'
          HEADLESS: 'true'
        run: node scripts/traverse-claim.js

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-shard-${{ matrix.shard }}
          path: screenshots/
          retention-days: 3
